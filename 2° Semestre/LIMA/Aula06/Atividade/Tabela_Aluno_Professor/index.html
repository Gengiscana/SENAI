<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro Professor e Aluno</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <h1>Cadastro</h1>

            <p>Preencha os dados abaixo</p>

            <input type="text" id="nome" placeholder="Nome">

            <input type="email" id="email" placeholder="E-mail">

            <input type="tel" id="telefone" placeholder="Telefone">
            <div class="opcao">
                <label><input type="radio" name="tipo" id="prof" value="Professor">Professor</label>
                <label><input type="radio" name="tipo" id="aluno" value="Aluno">Aluno</label>
            </div>
            <p id="alerta"></p>
            
            <button id="salvar">
                Salvar
            </button>

        </div>

        <div class="card tabela-container">

            <h2>Cadastros Aluno</h2>

            <table>

                <thead>

                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                    </tr>

                </thead>

                <tbody id="tabela_aluno">

                </tbody>

            </table>

        </div>
        <div class="card tabela-container">

            <h2>Cadastros Professor</h2>

            <table>

                <thead>

                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                    </tr>

                </thead>

                <tbody id="tabela_professor">

                </tbody>

            </table>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
