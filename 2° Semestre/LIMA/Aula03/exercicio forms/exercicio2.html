<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <b>
        <p>MANUTENÇÃO DE USUÁRIOS DO SISTEMA INTERNO</p>
        <form>
            <label>Login</label>
            <input type="text" required/>
            <br><br>
            <label>Senha</label>
            <input type="password" required/>
            <br><br>
            <label>Status</label>
            <select>
                <option>Ativo</option>
                <option>Inativo</option>
            </select>
            <br><br>
            <label>Tipo</label>
            <input type="radio" name="tecnico"/>
            <label>Técnico</label>
            <input type="radio" name="professor"/>
            <label>Professor</label>
            <input type="radio" name="aluno">
            <label>Aluno</label>
            <br><br>
            <label>Data Criação</label>
            <input type="date"/>
            <br><br>
            <label>Perfil</label>
            <input type="radio" name="convidado"/>
            <label>Convidado</label>
            <input type="radio" name="admin"/>
            <label>Administrador</label>
            <br><br>
            <label>Observações</label>
            <textarea></textarea>
            <br><br>
            <label>Módulos</label>
            <input type="checkbox" id="compras"/>
            <label>Compras</label>
            <input type="checkbox" id="biblioteca"/>
            <label>Biblioteca</label>
            <input type="checkbox" id="academico"/>
            <label>Acadêmico</label>
            <input type="checkbox" id="documentos"/>
            <label>Documentação</label>
            <input type="checkbox" id="rh"/>
            <label>Recursos Humanos</label>
            <br><br>
            <input type="submit" value="Cadastrar"/>
            <input type="reset" value="Excluir"/>
        </form>
    </b>
</body>
</html>
